apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      derivedFields:
        # click a trace id in a log line to open it in Zipkin
        - name: TraceID
          matcherRegex: '\[([0-9a-f]{16,32})-[0-9a-f]{16}\]'
          url: 'http://localhost:9411/zipkin/traces/$${__value.raw}'
  - name: Zipkin
    uid: zipkin
    type: zipkin
    access: proxy
    url: http://zipkin:9411
