# =============================================================================
# Production stack for ONE AWS Lightsail instance (8 GB RAM, 2 vCPU).
#
#   cd deploy && ./scripts/deploy.sh            (pulls images, starts, waits for health)
#
# Only Nginx (80/443) is reachable from the internet. Admin UIs (Eureka, RabbitMQ,
# Zipkin, Grafana) are bound to 127.0.0.1 — open them through an SSH tunnel.
# Images come from GitHub Container Registry (built by .github/workflows/ci.yml).
# =============================================================================

name: ecommerce-prod

x-java-service: &java-service
  restart: always
  networks: [backend]
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }
  environment: &common-env
    CONFIG_SERVER_URL: http://config-server:8888
    EUREKA_URL: http://discovery-server:8761/eureka/
    RABBITMQ_HOST: rabbitmq
    RABBITMQ_PORT: 5672
    RABBIT_USERNAME: ${RABBITMQ_USER}
    RABBIT_PASSWORD: ${RABBITMQ_PASSWORD}
    RABBITMQ_VHOST: /
    RABBITMQ_SSL: "false"
    ZIPKIN_URL: http://zipkin:9411/api/v2/spans
    TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-0.1}
    DB_HOST: postgres
    DB_PORT: 5432
    DB_USERNAME: ${POSTGRES_USER}
    DB_PASSWORD: ${POSTGRES_PASSWORD}
    API_DOCS_ENABLED: ${API_DOCS_ENABLED:-false}
    JPA_SHOW_SQL: "false"

x-healthcheck: &java-healthcheck
  interval: 15s
  timeout: 5s
  retries: 20
  start_period: 60s

services:
  # ------------------------------------------------------------------ edge
  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports: ["80:80", "443:443"]
    environment:
      API_DOMAIN: ${API_DOMAIN}
      AUTH_DOMAIN: ${AUTH_DOMAIN}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      api-gateway: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    mem_limit: 128m
    networks: [backend]

  certbot:
    image: certbot/certbot:v3.0.1
    profiles: [tools]          # run on demand: docker compose run --rm certbot renew
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot

  # ------------------------------------------------------------------ data
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=120"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 20
    mem_limit: 512m
    networks: [backend]

  mongodb:
    image: mongo:7.0
    restart: always
    command: ["--wiredTigerCacheSizeGB", "0.25"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes: [mongo_data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 20
    mem_limit: 512m
    networks: [backend]

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes: [rabbitmq_data:/var/lib/rabbitmq]
    ports: ["127.0.0.1:15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 20
    mem_limit: 448m
    networks: [backend]

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 20
    mem_limit: 96m
    networks: [backend]

  # -------------------------------------------------------------- identity
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    restart: always
    command: ["start", "--import-realm", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloakdb
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HOSTNAME: https://${AUTH_DOMAIN}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_PROXY_HEADERS: xforwarded      # TLS terminates at Nginx
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      FRONTEND_URL: ${FRONTEND_URL}     # substituted into the realm import
      JAVA_OPTS_KC_HEAP: "-XX:MaxRAMPercentage=65"
    volumes:
      - ./keycloak/ecom-app-realm.prod.json:/opt/keycloak/data/import/ecom-app-realm.json:ro
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 60s
    mem_limit: 1g
    networks: [backend]

  # --------------------------------------------------- spring cloud core
  config-server:
    <<: *java-service
    image: ghcr.io/${GHCR_OWNER}/ecommerce-config-server:${IMAGE_TAG:-latest}
    depends_on:
      rabbitmq: { condition: service_healthy }
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:8888/actuator/health/readiness | grep -q UP"]
    mem_limit: 384m

  discovery-server:
    <<: *java-service
    image: ghcr.io/${GHCR_OWNER}/ecommerce-discovery-server:${IMAGE_TAG:-latest}
    environment:
      EUREKA_HOSTNAME: discovery-server
    ports: ["127.0.0.1:8761:8761"]
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health/readiness | grep -q UP"]
    mem_limit: 384m

  # ----------------------------------------------------- business services
  user-service:
    <<: *java-service
    image: ghcr.io/${GHCR_OWNER}/ecommerce-user-service:${IMAGE_TAG:-latest}
    environment:
      <<: *common-env
      SPRING_DATA_MONGODB_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017/userdb?authSource=admin
      SPRING_DATA_MONGODB_DATABASE: userdb
    depends_on: &deps-mongo
      config-server: { condition: service_healthy }
      discovery-server: { condition: service_healthy }
      mongodb: { condition: service_healthy }
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health/readiness | grep -q UP"]
    mem_limit: 512m

  product-service:
    <<: *java-service
    image: ghcr.io/${GHCR_OWNER}/ecommerce-product-service:${IMAGE_TAG:-latest}
    environment:
      <<: *common-env
      DB_NAME: productdb
    depends_on: &deps-pg
      config-server: { condition: service_healthy }
      discovery-server: { condition: service_healthy }
      postgres: { condition: service_healthy }
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health/readiness | grep -q UP"]
    mem_limit: 512m

  order-service:
    <<: *java-service
    image: ghcr.io/${GHCR_OWNER}/ecommerce-order-service:${IMAGE_TAG:-latest}
    environment:
      <<: *common-env
      DB_NAME: orderdb
    depends_on: *deps-pg
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health/readiness | grep -q UP"]
    mem_limit: 576m

  payment-service:
    <<: *java-service
    image: ghcr.io/${GHCR_OWNER}/ecommerce-payment-service:${IMAGE_TAG:-latest}
    environment:
      <<: *common-env
      DB_NAME: paymentdb
      PAYMENT_MAX_AMOUNT: ${PAYMENT_MAX_AMOUNT:-50000.00}
    depends_on: *deps-pg
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/actuator/health/readiness | grep -q UP"]
    mem_limit: 512m

  notification-service:
    <<: *java-service
    image: ghcr.io/${GHCR_OWNER}/ecommerce-notification-service:${IMAGE_TAG:-latest}
    environment:
      <<: *common-env
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-true}
      MAIL_FROM: ${MAIL_FROM}
    depends_on:
      config-server: { condition: service_healthy }
      discovery-server: { condition: service_healthy }
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health/readiness | grep -q UP"]
    mem_limit: 448m

  api-gateway:
    <<: *java-service
    image: ghcr.io/${GHCR_OWNER}/ecommerce-api-gateway:${IMAGE_TAG:-latest}
    environment:
      <<: *common-env
      REDIS_HOST: redis
      KEYCLOAK_ISSUER_URI: https://${AUTH_DOMAIN}/realms/ecom-app
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/ecom-app/protocol/openid-connect/certs
      EUREKA_DASHBOARD_URL: http://discovery-server:8761
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      FORWARD_HEADERS_STRATEGY: framework
    depends_on:
      config-server: { condition: service_healthy }
      discovery-server: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness | grep -q UP"]
    mem_limit: 512m

  # ------------------------------------------------------- observability
  zipkin:
    image: openzipkin/zipkin:3.4
    restart: always
    environment:
      JAVA_OPTS: "-Xms64m -Xmx192m"
    ports: ["127.0.0.1:9411:9411"]
    mem_limit: 320m
    networks: [backend]

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: [observability]
    restart: always
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d"]
    volumes:
      - ../docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    mem_limit: 320m
    networks: [backend]

  loki:
    image: grafana/loki:3.3.2
    profiles: [observability]
    restart: always
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes: [loki_data:/loki]
    mem_limit: 256m
    networks: [backend]

  promtail:
    image: grafana/promtail:3.3.2
    profiles: [observability]
    restart: always
    command: ["-config.file=/etc/promtail/promtail.yml"]
    volumes:
      - ./promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    mem_limit: 128m
    networks: [backend]

  grafana:
    image: grafana/grafana:11.3.1
    profiles: [observability]
    restart: always
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ../docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports: ["127.0.0.1:3001:3000"]
    mem_limit: 256m
    networks: [backend]

networks:
  backend:
    name: ecommerce-prod-backend

volumes:
  postgres_data:
  mongo_data:
  rabbitmq_data:
  letsencrypt:
  certbot_www:
  prometheus_data:
  loki_data:
  grafana_data:
