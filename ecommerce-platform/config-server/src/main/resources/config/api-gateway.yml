server:
  port: ${SERVER_PORT:8080}
  # Behind Nginx: take client IP / scheme from X-Forwarded-* (Nginx overwrites them, so they cannot be spoofed)
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:framework}

spring:
  data:
    redis:   # backs the request rate limiter
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      server:
        webflux:
          # Browser frontends on other origins (React shop, admin panel). Comma separated list.
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
                allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
                allowed-headers: Authorization,Content-Type,Accept,X-Requested-With
                exposed-headers: Location,X-RateLimit-Remaining
                max-age: 3600
  security:
    oauth2:
      resourceserver:
        jwt:
          # "iss" claim expected in tokens (the public Keycloak URL clients log in through)
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8483/realms/ecom-app}
          # where the gateway downloads signing keys (internal URL in Docker); fetched lazily,
          # so the gateway does not need Keycloak to be up at startup
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8483/realms/ecom-app/protocol/openid-connect/certs}

# Swagger UI for all services: http://localhost:8080/swagger-ui.html
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
    path: /swagger-ui.html
    urls:
      - name: product-service
        url: /docs/product-service/v3/api-docs
      - name: user-service
        url: /docs/user-service/v3/api-docs
      - name: order-service
        url: /docs/order-service/v3/api-docs
      - name: payment-service
        url: /docs/payment-service/v3/api-docs

app:
  eureka-dashboard-url: ${EUREKA_DASHBOARD_URL:http://localhost:8761}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,refresh,circuitbreakers,gateway

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
    instances:
      productBreaker:
        baseConfig: default
      userBreaker:
        baseConfig: default
      orderBreaker:
        baseConfig: default
      cartBreaker:
        baseConfig: default
      paymentBreaker:
        baseConfig: default

info:
  app:
    name: api-gateway
    description: Single entry point for all client requests

logging:
  level:
    org.springframework.cloud.gateway: INFO
