server:
  port: ${SERVER_PORT:8083}

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ecomdb}
    username: ${DB_USERNAME:embarkx}
    password: ${DB_PASSWORD:embarkx}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Kolkata
  cloud:
    stream:
      bindings:
        createOrder-out-0:
          destination: order.exchange
          content-type: application/json
      kafka:
        binder:
          brokers: ${KAFKA_BROKERS:localhost:9092}

app:
  message: "Hello-order-auto-refresh"

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        registerHealthIndicator: true
        # business errors (404, out of stock...) are not failures of the downstream service
        ignoreExceptions:
          - com.app_ecom.exception.BusinessException
    instances:
      productService:
        baseConfig: default
      userService:
        baseConfig: default
  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 300ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        ignoreExceptions:
          - com.app_ecom.exception.BusinessException
    instances:
      productService:
        baseConfig: default
      userService:
        baseConfig: default
  ratelimiter:
    instances:
      messageRateLimiter:
        limitForPeriod: 2
        limitRefreshPeriod: 4s
        timeoutDuration: 0

info:
  app:
    name: order-service
    description: Cart and order service

logging:
  level:
    com.app_ecom: DEBUG
