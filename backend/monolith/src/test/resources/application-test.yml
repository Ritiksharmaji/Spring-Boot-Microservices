# Tests run on in-memory H2 (PostgreSQL mode) with the real Flyway migrations.
# The Testcontainers test runs the same migrations on real PostgreSQL (CI).
spring:
  datasource:
    url: jdbc:h2:mem:shop;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
app:
  bootstrap:
    admin-email: admin@test.local
    admin-password: Admin12345
logging:
  level:
    org.springframework.modulith: WARN
