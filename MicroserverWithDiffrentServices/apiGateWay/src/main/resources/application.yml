server:
  port: 8080

spring:
  application:
    name: apiGateWay
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: product-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/products/**

            - id: order-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/orders/**,/api/cart/**

            - id: user-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/users/**
logging:
  level:
    root: info
    org.springframework.cloud.gateway: TRACE
    org.springframework.cloud.gateway.route.RouteDefinitionLocator: INFO
management:
  endpoints:
    web:
      exposure:
        include: "*"
  tracing:
    sampling:
      probability: 1.0