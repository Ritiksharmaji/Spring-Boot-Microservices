server:
  port: 8888

spring:
  application:
    name: SpringCloudServerEcommerce
#  rabbitmq:
#    host: localhost
#    port: 5672
#    username: guest
#    password: guest
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBIT_USERNAME:guest}
    password: ${RABBIT_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:guest}
    connection-timeout: 30000
    ssl:
      enabled: ${RABBITMQ_SSL:true}
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          search-locations: file:///D:\Personal\CODE\Java-Code\MicroService\MicroserverWithDiffrentServices\SpringCloudConfigServerEcommerce\src\main\resources\config

## ------- actuar related configuration
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
    shutdown:
      enabled: true