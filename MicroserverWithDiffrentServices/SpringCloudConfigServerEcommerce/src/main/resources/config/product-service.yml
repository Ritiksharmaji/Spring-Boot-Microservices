## ----------------- by practies ----------------
server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: ${SPRING_APPLICATION_NAME:product-service}

  datasource:
    url: jdbc:postgresql://localhost:5432/ecomdb
    username: embarkx
    password: embarkx

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database: postgresql
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: Asia/Kolkata

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
    shutdown:
      enabled: true

info:
  app:
    name: E-Commerce-App-product
    description: Spring Boot Actuator Info Example
    version: 2.2.0
  developer:
    name: Ritik Sharma
    email: ritik@example.com

app:
  message: "Hello-product-auto-refresh-testing"

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true