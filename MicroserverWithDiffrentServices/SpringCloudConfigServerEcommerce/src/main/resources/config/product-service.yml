## ----- working with postgresQL with docker -----
spring:
  application:
    name: PRODUCT-SERVICE
  jackson:
    time-zone: Asia/Kolkata
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  datasource:
#    url: jdbc:postgresql://postgres:5432/ecomdb
    url: jdbc:postgresql://localhost:5432/ecomdb
    username: embarkx
    password: embarkx
    #driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database: postgresql
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: Asia/Kolkata

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0

info:
  app:
    name: E-Commerce-App-productModel
    description: Spring Boot Actuator Info Example
    version: 1.0.0

app:
  message: "Hello-product-auto-refresh"

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

logging:
  level:
    root: INFO
    com.app_ecom.product: TRACE
  file:
    name: logs/${spring.application.name}.log
  logback:
    rollingpolicy:
      max-file-size: 5MB
      max-history: 7


