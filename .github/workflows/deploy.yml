name: Deploy to AWS Lightsail

# Runs manually (choose an image tag) or when a version tag (v1.2.3) is pushed.
# Needs repository secrets LIGHTSAIL_HOST, LIGHTSAIL_USER, LIGHTSAIL_SSH_KEY and
# the repository variable DEPLOY_ENABLED=true (so forks / unconfigured repos skip it).
# See ecommerce-platform/docs/DEPLOYMENT.md.

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (latest or a short commit sha, e.g. sha-1a2b3c4)"
        required: true
        default: latest
  push:
    tags: ["v*"]

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - name: Resolve image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -e
            cd ~/ecommerce/deploy
            git -C ~/ecommerce fetch --quiet origin main && git -C ~/ecommerce reset --quiet --hard origin/main
            IMAGE_TAG=${{ steps.tag.outputs.value }} ./scripts/deploy.sh

      - name: Health check
        run: |
          for i in $(seq 1 30); do
            if curl -sf "https://${{ vars.API_DOMAIN }}/actuator/health" | grep -q UP; then
              echo "API is healthy"; exit 0
            fi
            sleep 10
          done
          echo "API did not become healthy"; exit 1
