name: Frontend CI

on:
  push:
    branches: [main, "branch-20*"]
    paths: ["frontend/web/**", ".github/workflows/frontend.yml"]
  pull_request:
    branches: [main]
    paths: ["frontend/web/**", ".github/workflows/frontend.yml"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend/web

jobs:
  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Bundle size
        run: du -sh dist dist/assets/*.js | tee -a "$GITHUB_STEP_SUMMARY"
