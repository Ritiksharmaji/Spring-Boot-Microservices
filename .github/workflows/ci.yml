name: CI

on:
  push:
    branches: [main, "branch-18*"]
    paths: ["ecommerce-platform/**", ".github/workflows/**"]
  pull_request:
    branches: [main]
    paths: ["ecommerce-platform/**", ".github/workflows/**"]
  workflow_dispatch:
    inputs:
      publish_images:
        description: "Also build and push the 8 service images to GHCR (needed only before a deployment)"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: ecommerce-platform

jobs:
  # ---------------------------------------------------------------------------
  build-and-test:
    name: Build & test (unit, integration, Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and run all tests
        run: ./mvnw -B -ntp verify

      - name: Test summary
        if: always()
        run: |
          echo "## Test results" >> "$GITHUB_STEP_SUMMARY"
          echo "| Module | Tests | Failures | Errors | Skipped |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for dir in */target/surefire-reports; do
            [ -d "$dir" ] || continue
            m=${dir%%/*}
            t=$(cat $dir/TEST-*.xml 2>/dev/null | grep -o 'tests="[0-9]*"' | head -100 | cut -d'"' -f2 | paste -sd+ - | bc)
            f=$(cat $dir/TEST-*.xml 2>/dev/null | grep -o 'failures="[0-9]*"' | cut -d'"' -f2 | paste -sd+ - | bc)
            e=$(cat $dir/TEST-*.xml 2>/dev/null | grep -o 'errors="[0-9]*"' | cut -d'"' -f2 | paste -sd+ - | bc)
            s=$(cat $dir/TEST-*.xml 2>/dev/null | grep -o 'skipped="[0-9]*"' | cut -d'"' -f2 | paste -sd+ - | bc)
            echo "| $m | ${t:-0} | ${f:-0} | ${e:-0} | ${s:-0} |" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: ecommerce-platform/*/target/surefire-reports/
          retention-days: 14

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: ecommerce-platform/*/target/site/jacoco/
          retention-days: 14

  # ---------------------------------------------------------------------------
  e2e:
    name: End-to-end smoke test (full docker compose stack)
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose config -q

      - name: Build images and start the stack
        run: docker compose up -d --build --wait --wait-timeout 600

      - name: Stack status
        if: always()
        run: docker compose ps

      - name: Run smoke test
        run: ./scripts/smoke-test.sh

      - name: Service logs (on failure)
        if: failure()
        run: docker compose logs --no-color --tail=300 > compose-logs.txt; tail -n 600 compose-logs.txt

      - name: Upload logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: ecommerce-platform/compose-logs.txt

      - name: Stop stack
        if: always()
        run: docker compose down -v

  # ---------------------------------------------------------------------------
  publish-images:
    name: Publish images (${{ matrix.module }})
    needs: e2e
    # Manual only (Actions -> CI -> Run workflow -> publish_images), so registry storage is used
    # only when you actually prepare a deployment.
    if: github.event_name == 'workflow_dispatch' && inputs.publish_images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        module: [config-server, discovery-server, api-gateway, user-service,
                 product-service, order-service, payment-service, notification-service]
    steps:
      - uses: actions/checkout@v4

      - name: Lower-case owner for GHCR
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.owner.outputs.name }}/ecommerce-${{ matrix.module }}
          tags: |
            type=sha,format=short
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: ecommerce-platform
          build-args: MODULE=${{ matrix.module }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.module }}
          cache-to: type=gha,mode=max,scope=${{ matrix.module }}
