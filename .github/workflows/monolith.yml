name: Monolith CI

on:
  push:
    branches: [main, "branch-19*", "branch-20*"]
    paths: ["ecommerce-monolith/**", ".github/workflows/monolith.yml"]
  pull_request:
    branches: [main]
    paths: ["ecommerce-monolith/**", ".github/workflows/monolith.yml"]
  workflow_dispatch:

concurrency:
  group: monolith-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: ecommerce-monolith

jobs:
  build-and-test:
    name: Build & test (modules, H2, PostgreSQL Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        run: ./mvnw -B -ntp verify
      - name: Test summary
        if: always()
        run: |
          echo "## Monolith tests" >> "$GITHUB_STEP_SUMMARY"
          grep -h "Tests run" target/surefire-reports/*.txt | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monolith-reports
          path: |
            ecommerce-monolith/target/surefire-reports/
            ecommerce-monolith/target/site/jacoco/
            ecommerce-monolith/target/spring-modulith-docs/
          retention-days: 14

  docker-image:
    name: Docker image builds
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ecommerce-monolith:ci .
      - name: Image size
        run: docker image ls ecommerce-monolith:ci --format '{{.Repository}}:{{.Tag}} {{.Size}}'
